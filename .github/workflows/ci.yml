name: CI

# GitHub only: the Forgejo runner also picks up .github/workflows when a repo has
# no .forgejo/workflows, so every job is gated on the server URL.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Ruff
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python
        run: ruff check ha-integration/custom_components/car_tracker tools/ hub/

  hub:
    name: tracker-hub tests
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest paho-mqtt

      - name: Run tests
        working-directory: hub
        run: python -m pytest tests/ -q

  firmware:
    name: PlatformIO
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Host tests (security rules in plain C++)
        run: |
          g++ -std=c++17 -Wall -Werror -I firmware/src firmware/test/host/test_hostcheck.cpp -o /tmp/test_hostcheck
          /tmp/test_hostcheck
          g++ -std=c++17 -Wall -Werror -I firmware/src firmware/test/host/test_cgnssinfo.cpp -o /tmp/test_cgnssinfo
          /tmp/test_cgnssinfo
          g++ -std=c++17 -Wall -Werror -I firmware/src firmware/test/host/test_gnssmode.cpp -o /tmp/test_gnssmode
          /tmp/test_gnssmode

      - name: Provide compile-time config.h
        # config.h is gitignored; example placeholders are enough to compile.
        run: cp firmware/src/config.example.h firmware/src/config.h

      - name: Build all firmware environments
        working-directory: firmware
        run: >-
          pio run
          -e wifi_dev
          -e sim7670g
          -e a7670e
          -e sim7080g
          -e sim7600e
          -e lilygo_a7670
          -e lilygo_wifi
