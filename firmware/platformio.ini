; car-tracker firmware
; One codebase, one environment per hardware variant (see docs/03-hardware-warianty.md).
; Build:  pio run -e wifi_dev -t upload
;         pio run -e sim7670g -t upload

[platformio]
default_envs = wifi_dev
src_dir = src

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.filesystem = littlefs
; TLS comes from ESP_SSLClient and not from the core: arduino-esp32 3.3.9 as
; shipped by this platform has no NetworkClientSecure/WiFiClientSecure library,
; and the same wrapper also gives us TLS over TinyGsmClient, so the verification
; path is identical on WiFi and on LTE (docs/09 section 9.3).
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    mikalhart/TinyGPSPlus@^1.0.3
    mobizt/ESP_SSLClient@^3.1.3
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=2048
    -DARDUINOJSON_ENABLE_STD_STRING=1

; ---------------------------------------------------------------------------
; Bench environment. No modem hardware needed, transport goes over WiFi.
; This is phase 0 of docs/11-plan-wdrozenia.md.
; ---------------------------------------------------------------------------
[env:wifi_dev]
build_flags =
    ${env.build_flags}
    -DTRANSPORT_WIFI=1
    -DDEV_BUILD=1

; ---------------------------------------------------------------------------
; Variant A: SIM7670G, LTE Cat-1 bis with GNSS. Recommended.
; SIM7670G is AT-compatible with the SIM7600 family, so we reuse that driver.
; ---------------------------------------------------------------------------
[env:sim7670g]
lib_deps =
    ${env.lib_deps}
    vshymanskyy/TinyGSM@^0.12.0
build_flags =
    ${env.build_flags}
    -DTRANSPORT_LTE=1
    -DTINY_GSM_MODEM_SIM7600
    -DMODEM_PROFILE_SIM7670G=1
    -DMODEM_HAS_GNSS=1

; ---------------------------------------------------------------------------
; SIMCom A7670E / A7670G, LTE Cat-1.
; GNSS presence depends on the module suffix: FASE has GNSS, LASE does not.
; MODEM_HAS_GNSS stays 0 until the exact part number is verified on the bench.
; ---------------------------------------------------------------------------
[env:a7670e]
lib_deps =
    ${env.lib_deps}
    vshymanskyy/TinyGSM@^0.12.0
build_flags =
    ${env.build_flags}
    -DTRANSPORT_LTE=1
    -DTINY_GSM_MODEM_A7672X
    -DMODEM_PROFILE_A7670=1
    -DMODEM_HAS_GNSS=0

; ---------------------------------------------------------------------------
; Variant B: SIM7080G, LTE-M/NB-IoT. No 2G fallback, see docs/03 section 3.3.
; ---------------------------------------------------------------------------
[env:sim7080g]
lib_deps =
    ${env.lib_deps}
    vshymanskyy/TinyGSM@^0.12.0
build_flags =
    ${env.build_flags}
    -DTRANSPORT_LTE=1
    -DTINY_GSM_MODEM_SIM7080
    -DMODEM_PROFILE_SIM7080G=1
    -DMODEM_HAS_GNSS=1
    -DMODEM_SUPPORTS_PSM=1

; ---------------------------------------------------------------------------
; Variant C: SIM7600E-H, LTE Cat-4.
; ---------------------------------------------------------------------------
[env:sim7600e]
lib_deps =
    ${env.lib_deps}
    vshymanskyy/TinyGSM@^0.12.0
build_flags =
    ${env.build_flags}
    -DTRANSPORT_LTE=1
    -DTINY_GSM_MODEM_SIM7600
    -DMODEM_PROFILE_SIM7600E=1
    -DMODEM_HAS_GNSS=1

; ---------------------------------------------------------------------------
; Variant D: LilyGO T-A7670 board (ESP32 + modem + PMU on one PCB).
; Different pin map, see include/pins.h.
; ---------------------------------------------------------------------------
[env:lilygo_a7670]
lib_deps =
    ${env.lib_deps}
    vshymanskyy/TinyGSM@^0.12.0
build_flags =
    ${env.build_flags}
    -DTRANSPORT_LTE=1
    -DTINY_GSM_MODEM_A7672X
    -DMODEM_PROFILE_A7670=1
    -DMODEM_HAS_GNSS=0
    -DBOARD_LILYGO_TA7670=1
