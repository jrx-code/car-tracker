; Standalone CAN sniffing probe. Separate from the main firmware for the same
; reason the GPS probe is: it answers "is the bus wired and running at the rate
; I think" without dragging in config.h, the broker or the state machine.
;
;   cd firmware/probe-can && pio run -t upload && pio device monitor
;
; The board runs off a power bank in the car and serves everything over HTTP,
; so no laptop travels along. Nothing here powers itself from the OBD socket.
[env:can_probe]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags =
    -DCORE_DEBUG_LEVEL=1
