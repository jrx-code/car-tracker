; Standalone GPS bring-up sketch. Deliberately separate from the main firmware:
; it needs no config.h, no WiFi and no broker, so it isolates "is the receiver
; wired correctly" from "is everything else configured correctly".
;
;   cd firmware/probe && pio run -t upload && pio device monitor
[env:gps_probe]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
lib_deps = mikalhart/TinyGPSPlus@^1.0.3
build_flags =
    -DCORE_DEBUG_LEVEL=1
